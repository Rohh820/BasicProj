<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="prac.css"/>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
<div class="main_box">
    
    <input type="checkbox" id="check">
    <div class="btn-one">
        <label for="check">
            <i class="fa-solid fa-bars"></i>
        </label>
    </div>
    
    <div class="sidebar_menu">
        <div class="btn-two">
         <label for="check">
            
            <i class="fa-solid fa-xmark"></i>
         </label>
        </div>
        <div class="sidebar_logo">
            <h3><a href=#>Apna College</a></h3>
        </div>
        <div class="options">
            <ul>
                <li><a href=#><i class="fa-solid fa-image"></i>Gallery</a></li>
                <li><a href=#><i class="fa-solid fa-square-up-right"></i>Shortcuts</a></li>
                <li><a href=#><i class="fa-solid fa-image"></i>Exhibits</a></li>
                <li><a href=#><i class="fa-regular fa-calendar"></i>Events</a></li>
                <li><a href=#><i class="fa-solid fa-store"></i>Store</a></li>
                <li><a href=#><i class="fa-regular fa-address-book"></i>Contacts</a></li>
                <li><a href=#><i class="fa-regular fa-comment"></i>Feedback</a></li>
            </ul>
        </div>
        <div class="social_media">
            <ul>
                <li><i class="fa-brands fa-facebook"></i></li>
                <li><i class="fa-brands fa-twitter"></i></li>
                <li><i class="fa-brands fa-instagram"></i></li>
                <li><i class="fa-brands fa-youtube"></i></li>       
            </ul>
        </div>
    </div>
</div>
</body>
</html>
